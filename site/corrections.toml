taux assis sur moins de 20 scrutins — c'est ce qui a été fait le 14 août quand
la présidente de l'Assemblée, à 100 % sur 19 votes, devenait « la députée la
plus assidue de la législature ». La dissidence, mesure voisine servie par la
même page, n'avait aucun seuil. La note méthodologique en annonçait pourtant un
depuis l'origine — un minimum de 50 votes comparables — que le site
n'appliquait pas.

Le losange à zéro vient du même défaut, une ligne plus loin : le grand chiffre
avait sa garde et rendait un tiret cadratin, la bande d'à côté recevait
`taux ou 0`."""
effet = """
La distribution de dissidence passe de 576 à 573 députés. Son minimum passe de
0,0 % — mesuré sur quatre votes — à 0,3 %. Les rangs et la position des losanges
se décalent en conséquence sur les 577 fiches ; la médiane de l'Assemblée est
