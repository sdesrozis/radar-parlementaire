[[correction]]
date = "2026-08-14"
titre = "Le chiffre de tête d'une mesure absente"
portee = "site"
erreur = """
La fiche d'un député dont la source ne publie aucun vote nominatif affichait
« 0,0 % » en très gros caractères, comme chiffre de présence, de délégation et
d'écart à la ligne. Le paragraphe placé juste en dessous expliquait au même
moment que « nous préférons une case vide à un zéro trompeur ». Le texte avait
raison et le chiffre le démentait ; c'est le chiffre qu'on lit."""
cause = """
Le générateur passait `pct(valeur or 0)` au gabarit : une mesure absente
traversait la frontière en zéro, et rien en aval ne pouvait plus distinguer
« zéro pour cent » de « pas de mesure ». La couche rédactionnelle, elle, testait
bien l'absence et produisait le bon texte — les deux couches ne se parlaient
pas.

C'est exactement l'erreur que le site reproche à tout le monde, et il la
commettait sur ses trois mesures de tête à la fois."""
effet = """
Une fiche sur 577 est concernée — celle du seul député en exercice dont la
source ne publie aucun suffrage — et ses trois mesures de tête à la fois :
« 0,0 % » → « — » sur la présence, sur la délégation et sur l'écart à la
ligne. Aucun taux réel ne change ; les zéros réellement mesurés — un député
qui n'a jamais délégué, un député qui ne s'est jamais écarté de sa ligne —
continuent de s'afficher « 0,0 % », parce qu'ils sont exacts.

Le chiffre de tête de toute mesure passe désormais par `grand_chiffre()`, qui
rend un tiret cadratin quand la valeur est absente."""
pages = "Les 577 fiches de député"
commit = "fb5d5e6"

[[correction]]
date = "2026-08-15"
titre = "Le texte de loi derrière chaque scrutin"
portee = "site"
erreur = """
Le site n'a jamais publié le nom de la loi sur laquelle portait un scrutin, ni
de lien vers son dossier législatif, en affirmant dans son code que la source ne
le renseignait pas. La source le renseigne : 2 608 des 8 434 scrutins de la
législature portent le nom de leur loi et l'identifiant de son dossier, dont 73
des 245 votes qui engagent. Ces 2 608 rattachements étaient perdus à la lecture
des fichiers, et l'absence était présentée comme une lacune de l'Assemblée."""
cause = """
Dans les JSON de l'Assemblée, `dossierLegislatif` n'est pas une chaîne mais un
objet à deux champs — le titre de la loi et la référence du dossier. Le parseur
lui appliquait la fonction qui extrait une valeur textuelle, laquelle rend
`None` sur un objet dépourvu de champ `#text`. La colonne sortait donc nulle sur
les 8 434 lignes, sans qu'aucune erreur ne soit levée.

Le plus grave n'est pas le bug, c'est ce qu'on en a conclu. Deux commentaires du
code — dans la définition de la table des scrutins, et dans le module qui
calcule les intervalles de confiance — affirmaient que « la source ne remplit
jamais dossierLegislatif », et le second justifiait par là un choix de méthode :
faute de dossier, le bootstrap regroupe les scrutins par séance. Une conclusion
tirée de notre propre défaut de lecture avait été écrite comme un fait sur les
données de l'Assemblée, puis avait servi d'argument."""
effet = """
Aucun chiffre publié ne change. Le rattachement récupéré fait apparaître le
titre de la loi et le lien vers son dossier sur les pages de vote qui en
disposent, et permet de compter les amendements déposés sur chaque loi.

La lacune restante est datée et publiée comme telle : l'Assemblée ne renseigne
ce champ que depuis le 26 mars 2026 — 2 des 5 824 scrutins antérieurs, la
totalité des 2 606 postérieurs. Les 172 votes qui engagent sans dossier
affichent la phrase qui le dit, et non un lien manquant en silence.

Le regroupement du bootstrap reste la séance : une colonne remplie à 31 % ne
peut pas servir de bloc de rééchantillonnage, et le commentaire qui justifiait
ce choix dit désormais pourquoi, au lieu d'invoquer un champ prétendument vide.
"""
pages = "Les 245 pages de vote, l'onglet « Les votes »"
commit = "bbcdbea"

[[correction]]
date = "2026-08-15"
titre = "Qui siégeait le jour du scrutin"
portee = "chiffre"
erreur = """
Les pages de vote annonçaient un nombre de députés en fonction supérieur au
nombre de sièges de l'Assemblée : 581 sur la page du scrutin du 2 juin 2026, et
jusqu'à 636 sur les scrutins d'octobre 2024, là où l'article 24 de la
Constitution en plafonne l'effectif à 577. Les députés en trop étaient publiés
comme absents de votes auxquels ils ne pouvaient pas prendre part.

261 214 couples député × scrutin étaient déclarés dans le mandat à tort, soit
6,8 % de toutes les absences publiées par le site, réparties sur 86 députés. Les
taux de présence de ces 86 députés étaient calculés sur un dénominateur qui
comptait des scrutins tenus avant leur entrée en fonction, ou pendant une
interruption de leur mandat."""
cause = """
Deux défauts empilés, tous deux dans la reconstruction des dates de mandat.

Le premier est une lecture de la source. Le champ `dateDebut` d'un mandat ne
date pas l'entrée en fonction du député : l'Assemblée y inscrit la date
d'ouverture de la législature pour tous les mandats, y compris ceux de
remplaçants entrés deux ans plus tard — 584 des 677 mandats de la 17ᵉ portent la
même valeur. La date d'entrée effective est publiée à côté, dans
`mandature/datePriseFonction`, et ce champ n'était pas lu. Une suppléante entrée
en fonction le 5 août 2026 était donc réputée siéger depuis le 7 juillet 2024.

Le second est une simplification de modèle. Un mandat était résumé par un
intervalle unique, de la première entrée à la dernière sortie. Or un mandat peut
être interrompu : un député nommé au Gouvernement rend son siège à son
suppléant, puis le reprend, et la source publie alors deux mandats séparés par
un trou de plusieurs mois. 29 mandats de cette législature sont dans ce cas.
L'intervalle unique comblait le trou, plaçant le titulaire en fonction pendant
qu'il était ministre — et son suppléant en fonction en même temps que lui.

Les deux défauts se rejoignent au même endroit : deux personnes occupaient la
même circonscription à la même date. C'est la forme sous laquelle l'erreur était
visible, et personne ne la regardait — aucun des 230 tests du dépôt ne comptait
de députés. Un effectif faux ne contredit aucune formule."""
effet = """
L'éligibilité est désormais une union d'intervalles, bornée par la prise de
fonction réelle. Sur la page du scrutin du 2 juin 2026, l'effectif passe de 581
à 577 et le relevé s'additionne : 212 pour, 364 absents, 1 empêché. Sur les
8 434 pages de vote, l'effectif publié ne dépasse plus jamais 577 ; il lui est
parfois inférieur, et la page dit alors combien de sièges étaient vacants.

Les taux de présence des 86 députés concernés changent, parfois du tout au tout,
tous à la hausse — aucun n'était surestimé. Quelques exemples, sur l'ensemble
des scrutins : Pauline Cestrières 10,2 % → 40,0 % ; Emmanuelle Hoffman
11,4 % → 27,9 % ; Astrid Panosyan-Bouvet 21,0 % → 35,4 % ; Stéphanie Rist
13,7 % → 18,3 % ; Marie-Christine Dalloz 17,4 % → 18,4 %. Une députée entrée en
fonction après le dernier scrutin publié affichait 0 % de présence sur 8 434
scrutins ; sa fiche dit maintenant qu'aucun scrutin ne relève de son mandat.

Six invariants sont désormais vérifiés sur l'intégralité des données avant que
la moindre page ne soit écrite, et leur échec arrête la publication au lieu de
l'assortir d'un avertissement : au plus 577 députés en fonction à chaque date,
une seule personne par circonscription, aucun suffrage attribué hors mandat, un
relevé dont les six statuts partitionnent l'effectif, et des totaux identiques à
ceux que publie l'Assemblée sur les 8 434 scrutins. Un test de régression
réinjecte l'ancien calcul et vérifie que les contrôles le refusent.

Les pages de vote et la page Méthode expliquent désormais l'écart aux 577 sièges
quand il existe, ce que « hors mandat » recouvre, et le cas du mandat
interrompu. La note méthodologique porte la définition corrigée."""
pages = "Les 245 pages de vote, les fiches des 86 députés concernés, la page Méthode"
commit = "743c002"

[[correction]]
date = "2026-08-15"
titre = "La composition des « votes qui engagent », sur la page Méthode"
portee = "site"
erreur = """
La page Méthode définissait les votes qui engagent comme « les scrutins sur
l'ensemble d'un texte, les motions de censure et les déclarations de politique
générale ». La phrase de l'accueil disait la même chose. Les déclarations de
politique générale n'en font pas partie : les 245 votes qui engagent sont 222
votes sur l'ensemble et 23 motions de censure, et les 19 déclarations sont
comptées parmi les autres scrutins."""
cause = """
La définition avait été écrite à la main dans le gabarit, de mémoire, et jamais
confrontée à `parse.PORTEES`, qui range la catégorie `declaration` en portée
intermédiaire. Le calcul n'a jamais inclus les déclarations : c'est la
description qui était fausse, pas le chiffre.

C'est la forme la plus discrète de l'erreur que ce site prétend combattre — un
dénominateur juste, décrit par une phrase qui ne le décrit pas. N'importe quel
lecteur recomptant le chiffre phare du site à partir de la définition publiée
trouvait 264 et non 245."""
effet = """
Aucun chiffre ne change : 245 votes qui engagent, avant comme après. La page
énonce désormais la composition exacte de l'assiette, et les trois nombres qui
la composent sont des jetons remplis par le comptage, non plus une phrase
écrite à la main. La note méthodologique donnait déjà la bonne définition."""
pages = "La page Méthode et l'accueil"
commit = "fbff49d"

[[correction]]
date = "2026-08-15"
titre = "Le rang et la bande de dissidence, fixés par quatre votes"
portee = "chiffre"
erreur = """
La distribution de dissidence de l'Assemblée — sa médiane, son minimum, les
rangs et la bande des 577 — retenait tous les taux publiés, quel que soit le
nombre de scrutins sur lesquels ils étaient mesurés. Les trois seuls députés en
exercice à 0,0 % de dissidence étaient précisément ceux dont le groupe n'avait
eu de ligne que sur 4, 8 et 25 scrutins. Ils occupaient à eux seuls l'extrémité
« discipline » de la population, et leurs fiches s'annonçaient mutuellement
« 2 députés sur 576 sont encore plus disciplinés » — alors que personne ne fait
mieux que zéro écart et qu'ils étaient à égalité.

Une députée dont le mandat a commencé après le dernier scrutin couvert, et dont
la fiche dit correctement qu'il n'y a rien à compter, recevait par ailleurs un
losange à 0,0 % sur cette même bande, avec une description sonore qui énonçait
« 0,0 % » sous une phrase disant que la mesure n'existe pas."""
cause = """
La règle existait déjà, écrite et appliquée, mais à une seule mesure. La
