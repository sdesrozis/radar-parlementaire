[[correction]]
date = "2026-08-13"
titre = "Sujets qui montent"
portee = "methode"
erreur = """
Le score des sujets divisait un nombre d'occurrences par un nombre de documents.
Ce n'est pas un taux : un terme martelé dix fois dans un même exposé des motifs
