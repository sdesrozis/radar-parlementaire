# ═══════════════════════════════════════════════════════════════════════════
# LE REGISTRE DES CORRECTIONS
#
# Le pied de page de chaque page promet qu'un chiffre faux « est corrigé
# publiquement ». Ce fichier est l'endroit où cette promesse s'exécute : il
# n'existe pas d'autre trace publique d'une correction, et une correction faite
# sans être écrite ici n'a pas été rendue publique.
#
# Une entrée s'ajoute **au moment du correctif**, pas après coup. Elle doit
# permettre à un lecteur qui aurait cité l'ancien chiffre de savoir exactement
# ce qui a changé et de combien : c'est la seule raison d'être du registre.
#
#   date     jour du correctif (AAAA-MM-JJ)
#   titre    la mesure touchée, nommée comme le site la nomme
#   portee   "chiffre"  un nombre publié était faux
#            "methode"  le nombre ne change pas, sa définition oui
#            "site"     ni chiffre ni méthode : la page elle-même
#   erreur   ce qui était faux, à l'indicatif, sans atténuation
#   cause    pourquoi c'était faux — la mécanique, pas l'excuse
#   effet    avant → après, chiffré chaque fois qu'un chiffre existe
#   pages    les pages du site qui affichaient l'ancienne valeur
#   commit   l'empreinte git du correctif, pour aller lire le code
#
# Ce fichier est une donnée, pas du code : il s'édite sans toucher au
# générateur, et `generer.py` le rend tel quel.
# ═══════════════════════════════════════════════════════════════════════════

[[correction]]
date = "2026-08-14"
titre = "Présence aux votes de la présidente de l'Assemblée"
portee = "chiffre"
erreur = """
La présence aux votes qui engagent de la présidente de l'Assemblée nationale
était publiée à 8,6 % — 19 votes exprimés sur 221 — ce qui la plaçait au dernier
rang de l'Assemblée. Le taux exact est 100 % : 19 votes exprimés sur les 19
scrutins où elle n'était pas empêchée de voter. Elle n'a manqué aucun des votes
auxquels elle pouvait prendre part."""
cause = """
Le président de l'Assemblée ne vote pas tant qu'il préside. La source le dit
explicitement, scrutin par scrutin, par le motif de non-vote « PAN ». Ce motif
manquait à la liste des causes structurelles du code, qui ne contenait que le
membre du Gouvernement et le président de séance : ses 7 508 non-votes restaient
donc au dénominateur de présence, comme s'il s'agissait d'absences.

La liste contenait par ailleurs un code « PDS » qui ne correspond à aucune ligne
de la source, et glosait deux codes différents par « président de séance ».
Elle avait été écrite d'après une supposition sur la nomenclature de
l'Assemblée, jamais confrontée aux motifs réellement présents dans les fichiers.
C'est exactement l'erreur que la mesure prétendait écarter : le site a publié
comme de l'absentéisme ce que la source désignait comme une fonction
incompatible avec le vote."""
effet = """
Présidente de l'Assemblée : 8,6 % (19/221) → 100 % (19/19) sur les votes qui
engagent. Elle passait du dernier rang au premier. Quarante-six députés voient
leur dénominateur de présence corrigé, ceux qui ont présidé une séance ou exercé
une fonction ministérielle ; pour eux le retrait est marginal, l'écart étant
concentré sur la seule titulaire du perchoir. La médiane de l'Assemblée est
inchangée à 41 %.

Un test verrouille désormais les deux sens de l'erreur : toute cause de non-vote
présente dans la source doit être explicitement classée comme structurelle ou
non, et toute cause déclarée structurelle doit exister dans la source."""
pages = "La fiche de la présidente de l'Assemblée, l'annuaire, l'accueil, Méthode"
commit = "0384307"

