C'était bien un défaut de parsing, corrigé la veille : `dossierLegislatif` est
un objet `{libelle, dossierRef}` auquel le code appliquait une fonction qui
n'extrait que du texte, et qui rendait donc `None` sur les 8 434 lignes. Le
