[[correction]]
date = "2026-08-15"
titre = "L'assiette réelle de la position estimée"
portee = "site"
erreur = """
Chaque fiche annonçait une position « estimée à partir de ses N votes sur les
textes qui engagent », N étant le nombre de suffrages du député sur les 245
votes qui engagent. Le modèle n'en utilise pas autant : il est estimé sur 127
de ces 245 scrutins, et il ne lit que les « pour » et les « contre ». Les 23
motions de censure en sortent toutes. La largeur de l'intervalle était expliquée
par la même quantité surestimée."""
cause = """
Le modèle de points idéaux applique trois filtres avant d'estimer : il ignore
les abstentions, parce qu'il est binaire ; il écarte les scrutins quasi
unanimes, qui n'ordonnent personne ; il écarte ceux qui ont trop peu de votants.
Les motions de censure tombent sous le deuxième : la source n'y publie ni
« contre » ni abstention — seuls les soutiens de la motion votent — de sorte que
la position minoritaire y est nulle par construction.

Ces filtres étaient documentés dans le code et dans la note. Ce qui manquait,
c'est leur conséquence chiffrée servie jusqu'à la fiche : le site parlait de
l'assiette qu'il avait offerte au modèle, pas de celle que le modèle avait
retenue."""
effet = """
Aucune position ni aucun intervalle ne change. La fiche annonce désormais le
nombre de « pour » et de « contre » de ce député que le modèle a effectivement
lus, et le nombre de scrutins retenus ; les deux viennent du modèle lui-même et
non d'un recomptage. La page Méthode publie l'écart entre 245 et 127 et dit
pourquoi les motions de censure en sortent. La note méthodologique porte la
même précision."""
pages = "Les 577 fiches de député et la page Méthode"
commit = "fbff49d"

