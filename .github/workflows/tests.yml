name: tests

# Les tests ne touchent jamais au réseau : ils travaillent sur des tables
# fabriquées à la main. C'est ce qui permet de les lancer à chaque poussée sans
# retélécharger les 1,7 Go de l'open data — la génération du site, elle, en a
# besoin et n'a donc rien à faire ici.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      # `fetch-depth: 0` récupère tout l'historique. Le défaut de `checkout` est
      # un clone superficiel d'un seul commit, et `test_corrections.py` vérifie
      # que chaque empreinte du registre désigne un commit réel : sur un clone
      # superficiel, les commits cités n'existent pas localement et le contrôle
      # échouait sur les douze entrées. Le dépôt est petit, le coût est nul, et
      # la vérification retrouve son sens — c'est elle qui attraperait une
      # empreinte fausse dans un registre que le site publie sous forme de liens.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Installer uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Installer les dépendances
        run: uv sync --extra dev

      - name: Lancer les tests
        run: uv run pytest -q

  # Le paquet doit rester installable et utilisable seul : c'est toute la raison
  # d'avoir sorti le site de `src/radar/`. Ce travail échoue si quelqu'un y
  # réintroduit une importation vers `site/`.
  paquet-autonome:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Installer uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Installer le seul paquet, sans le site
        run: uv sync --no-dev

      - name: Le paquet s'importe et expose sa frontière
        run: |
          uv run python -c "
          from radar import analyze, ideal, vues
          assert hasattr(vues, 'Donnees')
          print('radar importable sans le site')
          "

      - name: Aucun HTML, CSS ou JavaScript dans le paquet
        run: |
          trouves=$(find src/radar -name '*.html' -o -name '*.css' -o -name '*.js')
          if [ -n "$trouves" ]; then
            echo "Le paquet contient des fichiers de site :"
            echo "$trouves"
            exit 1
          fi
          echo "src/radar/ ne contient aucun fichier de site"
