[project]
name = "radar"
version = "0.1.0"
description = "Radar politique : votes, amendements et interventions de l'Assemblée nationale"
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Sylvain Desroziers", email = "sylvain.desroziers@protonmail.com" }]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "polars>=1.0",
    "pyarrow>=16",
    "numpy>=2.0",
    "scipy>=1.13",
    "typer>=0.12",
    "rich>=13.7",
    "matplotlib>=3.9",
    "reportlab>=4.2",
    # Recompression des portraits par le générateur du site. Elle arrivait déjà
    # dans l'environnement par matplotlib ; s'en remettre à cette dépendance
    # indirecte, c'est laisser la génération du site casser le jour où
    # matplotlib cesse d'en avoir besoin.
    "pillow>=10.0",
]

[project.optional-dependencies]
notebook = ["jupyterlab>=4.2", "ipykernel>=6.29", "nbconvert>=7.16"]
dev = ["pytest>=8.2"]

[project.scripts]
radar = "radar.cli:app"

[build-system]
requires = ["uv_build>=0.9.7,<0.10.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "radar"
module-root = "src"
